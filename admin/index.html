<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMR Strategies | Enterprise Admin Panel (CMS)</title>
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0D6EFD',
              navy: '#061D49',
              gold: '#D4AF37',
              bg: '#F8FAFC',
              darkBg: '#0F172A',
              cardDark: '#1E293B'
            }
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans dark:bg-slate-900 dark:text-slate-100 min-h-screen">
  <div id="admin-root">
    <!-- Sleek Loader while React initializes -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0F172A; color: #FFFFFF; font-family: 'Manrope', sans-serif;">
      <div style="width: 48px; height: 48px; border: 4px solid rgba(13,110,253,0.2); border-top-color: #0D6EFD; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem;"></div>
      <h3 style="font-size: 1.1rem; font-weight: 800; color: #FFFFFF; margin: 0;">Loading IDMR Admin Panel...</h3>
      <p style="font-size: 0.8rem; color: #94A3B8; margin-top: 0.4rem;">Enterprise CMS v2.0</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <!-- Dynamic Script & Style Loader to prevent blank screen across all URL routing patterns -->
  <script>
    (function() {
      var p = window.location.pathname;
      var isSubDir = p.includes('/admin/') || p.endsWith('/admin/');
      var cssPath = isSubDir ? 'styles.css' : 'admin/styles.css';
      var jsPath = isSubDir ? 'app.js' : 'admin/app.js';

      // Load Stylesheet
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = cssPath;
      document.head.appendChild(link);

      // Load App Script via Babel
      var script = document.createElement('script');
      script.type = 'text/babel';
      script.src = jsPath;
      script.onerror = function() {
        // Fallback retry if secondary path needed
        var altScript = document.createElement('script');
        altScript.type = 'text/babel';
        altScript.src = isSubDir ? 'admin/app.js' : 'app.js';
        document.body.appendChild(altScript);
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
